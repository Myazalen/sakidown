<!--
* @file popup/popup.html
* @description 浏览器扩展弹窗入口
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakiDown</title>
    <link rel="stylesheet" href="../ui/theme.css">
    <link rel="stylesheet" href="../ui/components.css">
    <link rel="stylesheet" href="../ui/layouts.css">
    <style>
        body { margin:0; padding:0; width:320px; overflow:hidden; background:hsl(var(--background)); }
        .setting-row { display:flex; align-items:center; gap:8px; margin:6px 0; }
        .setting-row label { white-space:nowrap; font-size:12px; color:hsl(var(--muted-foreground)); }
        .setting-row input[type="number"] { width:60px; padding:3px 6px; border:1px solid hsl(var(--border)); border-radius:4px; font-size:12px; background:hsl(var(--background)); color:hsl(var(--foreground)); }
        .setting-row input[type="text"] { flex:1; padding:3px 6px; border:1px solid hsl(var(--border)); border-radius:4px; font-size:12px; background:hsl(var(--background)); color:hsl(var(--foreground)); }
        .separator { border:none; border-top:1px solid hsl(var(--border)); margin:8px 0; }

        .page-info { font-size:11px; color:hsl(var(--muted-foreground)); padding:4px 0; }
        .page-info .page-type-label { font-weight:bold; }
        .page-info .page-type-label.search { color: #f39c12; }
        .page-info .page-type-label.normal { color: #3498db; }
        .page-info .page-type-label.unknown { color: #999; }

        .btn-group { display:flex; gap:6px; }
        .btn-group button { flex:1; }
        button { width:100%; padding:6px 10px; border:none; border-radius:4px; font-size:12px; cursor:pointer; margin:3px 0; transition:opacity 0.2s; }
        button:hover { opacity:0.85; }
        button:disabled { opacity:0.5; cursor:not-allowed; }
        button.primary { background:hsl(var(--primary)); color:hsl(var(--background)); }
        button.success { background:#2ecc71; color:#fff; }
        button.warning { background:#f39c12; color:#fff; }
        button.danger { background:#888; color:#fff; }

        .status-box { background:hsl(var(--muted)); border-radius:4px; padding:6px 8px; min-height:40px; max-height:120px; overflow-y:auto; font-size:11px; line-height:1.5; margin-top:6px; }
        .status-box .info { color:#3498db; }
        .status-box .success { color:#2ecc71; }
        .status-box .error { color:#e74c3c; }
        .status-box .warn { color:#f39c12; }

        .hidden { display:none; }
        .section { margin:6px 0; }
        .section-label { font-size:11px; color:hsl(var(--muted-foreground)); margin-bottom:4px; }
        .progress-info { margin:3px 0; font-size:11px; color:hsl(var(--muted-foreground)); }
    </style>
</head>
<body>
    <div class="ud-popup-container">
        <div class="ud-popup-header" style="padding:0 0 8px 0;">
            <span class="ud-popup-title">SakiDown</span>
            <span class="ud-popup-version">v0.1.0</span>
        </div>

        <div id="btn-download" class="ud-popup-item">
            <div class="ud-popup-icon"></div>
            <span>下载视频</span>
        </div>
        <div id="btn-manager" class="ud-popup-item">
            <div class="ud-popup-icon"></div>
            <span>任务管理</span>
        </div>

        <div class="page-info" id="pageInfo">
            当前页面: <span id="pageTypeLabel" class="page-type-label unknown">检测中...</span>
        </div>

        <hr class="separator">

        <!-- Search page batch download controls -->
        <div id="searchControls" class="hidden">
            <div class="section-label">📋 搜索页批量下载音频</div>
            <div class="setting-row">
                <label>目标链接数:</label>
                <input type="number" id="targetLinkCount" value="20" min="5" max="200" step="5">
            </div>
            <div class="setting-row">
                <label>间隔(秒):</label>
                <input type="number" id="searchDelayInput" value="5" min="1" max="60" step="0.5">
            </div>
            <div class="setting-row">
                <label>每链接最多:</label>
                <input type="number" id="maxFilesPerLink" value="1" min="1" max="50" step="1" style="width:50px;">
                <span style="font-size:11px;color:hsl(var(--muted-foreground));">个文件</span>
            </div>
            <div class="btn-group">
                <button id="scrapeLinksBtn" class="primary">🔗 获取链接</button>
                <button id="startSearchCrawlBtn" class="success" disabled>▶ 开始</button>
                <button id="stopSearchCrawlBtn" class="warning">⏹ 停止</button>
            </div>
            <div class="progress-info">
                已获取: <span id="searchLinkCount">0</span> 个链接
            </div>
        </div>

        <hr class="separator">

        <div class="setting-row">
            <input type="checkbox" id="showQuickBtn">
            <label for="showQuickBtn">页面显示下载按钮</label>
        </div>
        <div class="setting-row">
            <label>任务间隔:</label>
            <input type="number" id="taskInterval" min="0" max="60" value="5">
            <span style="font-size:11px;color:hsl(var(--muted-foreground));">秒</span>
        </div>

        <div class="status-box" id="statusBox">
            <div class="info">就绪</div>
        </div>
    </div>

    <script src="../ui/dom-utils.js"></script>
    <script src="../settings/theme.js"></script>
    <script src="popup.js"></script>
</body>
</html>
